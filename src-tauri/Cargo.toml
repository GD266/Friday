[package]
name = "friday"
version = "0.1.0"
description = "FRIDAY — personal AI computer assistant for Windows (Phase 1: foundation)"
authors = ["FRIDAY"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Outbound HTTPS for the AI provider (OpenAI-compatible, SSE streaming).
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
